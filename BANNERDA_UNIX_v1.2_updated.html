<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171c24">
<title>BANNERDA UNIX</title>
<style>
:root{--bg:#171c24;--blue:#28a8ff;--bright:#48bdff;--dim:#17649b;--text:#dce8f3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Courier New",monospace}
body{min-height:100vh;padding:42px 22px 54px;background:radial-gradient(ellipse at 50% 0%,rgba(40,168,255,.11),transparent 48%),linear-gradient(145deg,#171c24,#111720 75%)}
.wrap{width:100%;max-width:620px;margin:auto}
h1{margin:0;text-align:center;color:var(--bright);font-size:clamp(32px,8vw,52px);text-shadow:0 0 8px rgba(40,168,255,.75)}
.sub{text-align:center;color:var(--blue);font-size:19px;margin:18px 0 24px}
.tg{text-align:center;color:#9dcfff;font-size:18px;margin-bottom:42px}
.tg-dot{display:inline-flex;width:31px;height:31px;border-radius:50%;background:var(--blue);color:#07131e;align-items:center;justify-content:center;margin-right:12px}
.line{height:2px;background:var(--blue);margin-bottom:34px;box-shadow:0 0 9px var(--blue)}
.card{border:2px solid var(--dim);border-radius:8px;padding:32px 38px 36px;background:rgba(25,34,46,.92);box-shadow:0 0 15px rgba(23,100,155,.32)}
.title{color:var(--bright);font-size:27px;font-weight:bold;border-bottom:2px solid var(--dim);padding-bottom:10px;margin-bottom:30px}
label{display:block;color:#8fcfff;font-size:18px;margin-bottom:12px}
input{display:block;width:100%;height:58px;border:2px solid var(--dim);border-radius:7px;background:#111720;color:var(--text);padding:0 15px;font:17px "Courier New",monospace;outline:none;margin-bottom:30px}
input:focus{border-color:var(--bright);box-shadow:0 0 10px rgba(40,168,255,.35)}
input::placeholder{color:#71869a}
button{width:100%;min-height:62px;border:1px solid var(--bright);border-radius:7px;background:linear-gradient(180deg,#35b3ff,#1687d0);color:#061522;font:bold 21px "Courier New",monospace;cursor:pointer;box-shadow:0 0 14px rgba(40,168,255,.25)}
button:disabled{cursor:wait;opacity:.55}
.credit{text-align:center;color:#6c9fc6;font-size:15px;margin-top:34px}
.status{display:none;text-align:center;margin-top:26px;color:var(--bright);font-size:17px}
.spinner{width:32px;height:32px;border:4px solid #24435b;border-top-color:var(--bright);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 13px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:9px;background:#101a25;border:1px solid #24577d;border-radius:8px;overflow:hidden;margin-top:17px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#1687d0,#54c5ff);box-shadow:0 0 11px var(--blue);transition:width .2s linear}
.percent{margin-top:9px;color:#a8dfff}
.error,.login-error{display:none;color:#ff646e;text-align:center;margin:0 0 20px;font-size:15px}
.login-card{max-width:460px;margin:58px auto 0}
.login-card .title{margin-bottom:24px}
.hidden{display:none!important}
@media(max-width:520px){body{padding:30px 16px 42px}.card{padding:27px 22px 30px}.title{font-size:23px}.sub,.tg{font-size:16px}.tg{margin-bottom:32px}label{font-size:16px}input{height:55px;font-size:16px;margin-bottom:25px}button{min-height:58px;font-size:19px}.credit{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<h1>BANNERDA UNIX</h1>
<div class="sub">WhatsApp Banner Tool</div>
<div class="tg"><span class="tg-dot">➤</span>Telegram: @marlonxp</div>
<div class="line"></div>

<section class="card login-card" id="loginScreen">
  <div class="title">ACCESS TERMINAL</div>
  <form id="loginForm">
    <label for="passcode">ENTER PASSCODE:</label>
    <input id="passcode" type="password" placeholder="Enter access passcode" autocomplete="current-password" required>
    <div class="login-error" id="loginError">ACCESS DENIED | INCORRECT PASSCODE</div>
    <button type="submit">UNLOCK</button>
  </form>
</section>

<main id="mainInterface" class="hidden">
<form class="card" id="toolForm">
  <div class="title">WHATSAPP INFORMATION</div>
  <label for="number">WhatsApp Number:</label>
  <input id="number" type="tel" inputmode="tel" placeholder="+1234567890" autocomplete="off" required>
  <label for="dns">DNS PAYLOAD:</label>
  <input id="dns" type="text" placeholder="104.18.32.123:53" autocomplete="off" required>
  <div class="error" id="error">Enter both the number and DNS value.</div>
  <button type="submit" id="execute">EXECUTE</button>
  <div class="status" id="status" aria-live="polite">
    <div class="spinner" id="spinner"></div>
    <div id="statusText">SEQUENCE VALIDATED</div>
    <div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="bar" id="bar"></div>
    </div>
    <div class="percent" id="percent">0%</div>
  </div>
</form>
</main>

<div class="credit">CREDIT: BY BANNERDA UNIX | VERSION 1.2</div>
</div>

<script>
(() => {
  "use strict";
  const REQUIRED_PASSCODE = "BANXMARLO";

  const loginForm = document.getElementById("loginForm");
  const passcode = document.getElementById("passcode");
  const loginError = document.getElementById("loginError");
  const loginScreen = document.getElementById("loginScreen");
  const mainInterface = document.getElementById("mainInterface");

  loginForm.addEventListener("submit", (event) => {
    event.preventDefault();
    if (passcode.value === REQUIRED_PASSCODE) {
      loginError.style.display = "none";
      loginScreen.classList.add("hidden");
      mainInterface.classList.remove("hidden");
      document.getElementById("number").focus();
    } else {
      loginError.style.display = "block";
      passcode.value = "";
      passcode.focus();
    }
  });

  const form = document.getElementById("toolForm");
  const number = document.getElementById("number");
  const dns = document.getElementById("dns");
  const error = document.getElementById("error");
  const status = document.getElementById("status");
  const bar = document.getElementById("bar");
  const statusText = document.getElementById("statusText");
  const percent = document.getElementById("percent");
  const progress = status.querySelector('[role="progressbar"]');
  const spinner = document.getElementById("spinner");
  const execute = document.getElementById("execute");
  let timer = null;

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    if (!number.value.trim() || !dns.value.trim()) {
      error.style.display = "block";
      return;
    }

    error.style.display = "none";
    if (timer) clearInterval(timer);
    status.style.display = "block";
    statusText.textContent = "SEQUENCE VALIDATED";
    spinner.style.display = "block";
    execute.disabled = true;
    bar.style.width = "0%";
    percent.textContent = "0%";
    progress.setAttribute("aria-valuenow", "0");

    let value = 0;
    // 100 steps × 1,030 ms = 103,000 ms (1 minute 43 seconds).
    timer = setInterval(() => {
      value = Math.min(value + 1, 100);
      bar.style.width = value + "%";
      percent.textContent = value + "%";
      progress.setAttribute("aria-valuenow", String(value));

      if (value >= 100) {
        clearInterval(timer);
        timer = null;
        spinner.style.display = "none";
        statusText.textContent = "COMPLETED | AWAIT RESULTS";
        execute.disabled = false;
      }
    }, 1030);
  });
})();
</script>
</body>
</html>
